<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0b">
    <title>Contenders - DYNAMIC EFOOTBALL COMMUNITY 2026</title>
    <link rel="icon" type="image/png" href="assets/images/sitelogo.png">
    <link rel="apple-touch-icon" href="assets/images/sitelogo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-responsive.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .contenders-header {
            text-align: center;
            color: white;
            margin-bottom: 80px;
        }

        .contenders-header h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .contenders-header p {
            font-size: 18px;
            opacity: 0.9;
            margin-top: 10px;
        }

        .contenders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .contender-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 16px;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            height: auto;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .contender-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.15);
            border-color: rgba(102, 126, 234, 0.2);
        }

        .contender-image {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 5;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #eee;
            padding: 8px;
        }

        .contender-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            z-index: 1;
        }

        .contender-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s ease;
            z-index: 0;
            position: relative;
            top: auto;
            left: auto;
            max-height: 260px;
        }

        .contender-card:hover .contender-image img {
            transform: scale(1.05);
        }

        .contender-image.no-image {
            font-size: 80px;
            color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
        }

        .contender-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contender-name {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .contender-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .meta-tag {
            background: linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            color: #667eea;
            font-weight: 600;
            border: 1px solid rgba(102, 126, 234, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contender-description {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .view-btn {
            margin-top: 8px;
            padding: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .view-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            position: relative;
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .modal-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-header.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            color: rgba(255,255,255,0.2);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-body h2 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 32px;
        }

        .modal-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .modal-meta-item {
            background: #f5f5f5;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .modal-meta-item strong {
            color: #333;
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .modal-description {
            font-size: 15px;
            line-height: 1.7;
            color: #666;
            margin: 20px 0;
        }

        .modal-trophies {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 165, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .modal-trophies h3 {
            color: #FFD700;
            font-size: 18px;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trophy-count {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
        }

        .trophy-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .trophy-item {
            background: white;
            border-left: 4px solid #FFD700;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .trophy-item-icon {
            font-size: 20px;
        }

        .trophy-item-name {
            color: #333;
            font-weight: 500;
        }

        .trophy-item-league {
            color: #666;
            font-size: 12px;
        }

        .no-trophies {
            color: #999;
            font-style: italic;
            padding: 10px;
        }

        .modal-action {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .vote-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .vote-btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .contenders-header {
            margin-bottom: 32px;
        }

        .contender-view-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 24px 0 32px;
        }

        .contender-view-button {
            min-height: 44px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .contender-view-button[aria-pressed="true"] {
            background: #fff;
            color: #4d56a8;
        }

        .contender-view-button:focus-visible,
        .view-btn:focus-visible {
            outline: 3px solid #ffd400;
            outline-offset: 3px;
        }

        .contender-event-group {
            margin-bottom: 36px;
        }

        .contender-event-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 16px 18px;
            margin-bottom: 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .contender-event-heading h2 {
            margin: 0;
            font-size: clamp(18px, 3vw, 22px);
            overflow-wrap: anywhere;
        }

        .contender-event-heading p {
            margin: 0;
            opacity: 0.92;
        }

        .contender-event-status {
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: capitalize;
        }

        .contender-event-detail {
            background: #f0f1f8;
            color: #4b5563;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            margin: 0 0 10px;
        }

        .past-contender-note {
            padding: 10px 12px;
            border-radius: 8px;
            background: #f4f4f8;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 16px;
            }

            .contenders-header h1 {
                font-size: clamp(30px, 9vw, 40px);
            }

            .contender-view-controls {
                position: sticky;
                top: 0;
                z-index: 20;
                padding: 10px 0;
                margin: 16px 0 24px;
                background: rgba(11, 11, 11, 0.92);
                backdrop-filter: blur(8px);
            }

            .contender-view-button {
                flex: 1 1 145px;
                padding: 10px 12px;
            }

            .contenders-grid {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
                gap: 12px;
            }

            .contender-event-heading {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px;
            }
        }

        /* Vote overlay and ranking styles */
        .contender-votes-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .rank-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: white;
            color: #333;
            font-weight: bold;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .rank-1 { 
            background: gold; 
            color: black; 
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        .rank-2 { 
            background: silver; 
            color: black; 
        }
        .rank-3 { 
            background: #cd7f32; 
            color: white; 
        }

        /* Top 3 highlight styles */
        .top-1 {
            border: 2px solid gold;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }

        .top-2 {
            border: 2px solid silver;
        }

        .top-3 {
            border: 2px solid #cd7f32;
        }

        /* Vote percentage bar */
        .vote-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 20px;
            margin-top: 8px;
            overflow: hidden;
        }

        .vote-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 20px;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>🏆 DYNAMIC EFOOTBALL COMMUNITY 2026</h1>

    <main>
        <div class="container">
            <div class="contenders-header">
                <h1>Contenders</h1>
                <p>View and compete with event contenders</p>
                <div class="contender-view-controls" role="group" aria-label="Contender event views">
                    <button id="currentContendersButton" class="contender-view-button" type="button" aria-pressed="true" onclick="showContenderView(false)">Current Event</button>
                    <button id="pastContendersButton" class="contender-view-button" type="button" aria-pressed="false" onclick="showContenderView(true)">Past Contenders</button>
                </div>
                <button onclick="loadContenders()" style="margin-top: 20px; padding: 10px 20px; background: #fff; color: #667eea; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">🔄 Refresh Contenders</button>

    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header" id="modalImage"></div>
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body">
                <h2 id="modalName"></h2>
                <div class="modal-meta">
                    <div class="modal-meta-item">

    <footer>
        <p>© 2026 DYNAMIC EFOOTBALL COMMUNITY Project</p>

    <script src="js/api-config.js"></script>
    <script>
        let allContenders = [];
        let hallOfFameData = null; // Cache for hall of fame data
        let showingPastContenders = false;

        // Load hall of fame data
        async function loadHallOfFameData() {
            if (hallOfFameData) return; // Use cache if available
            try {
                const res = await fetch(`${API_BASE_URL}/admin/hall-of-fame-web`);
                const result = await res.json();
                hallOfFameData = result.success ? result.data : {};
            } catch (err) {
                console.error('Error loading Hall of Fame data:', err);
                hallOfFameData = {};
            }
        }

        // Get player's trophies from hall of fame
        function getPlayerTrophies(playerName) {
            if (!hallOfFameData) return [];
            
            const trophies = [];
            for (const [leagueName, players] of Object.entries(hallOfFameData)) {
                if (players[playerName]) {
                    const wins = players[playerName].wins || [];
                    wins.forEach(win => {
                        trophies.push({
                            league: leagueName,
                            teamName: win.team_name,
                            teamLogo: win.team_logo,
                            season: win.season
                        });
                    });
                }
            }
            return trophies;
        }

        // Load current and past event contenders
        async function loadContenders() {
            try {
                // Load hall of fame data
                await loadHallOfFameData();

                // Load current and past contenders so switching views does not require another request.
                const contRes = await fetch(`${API_BASE_URL}/events/all-contenders?includePast=true&t=${Date.now()}`);
                const contResult = await contRes.json();
                
                if (!contRes.ok || !contResult.success) {
                    throw new Error(contResult.error || 'Unable to load contenders');
                }
                if (!Array.isArray(contResult.data)) throw new Error('The contenders response was invalid');

                allContenders = contResult.data;
                renderContenders();
            } catch (err) {
                console.error('Error loading contenders:', err);
                showEmpty(`Unable to load contenders: ${err.message}`);
            }
        }

        function renderContenders() {
            const container = document.getElementById('contendersContainer');
            const isPastEvent = contender => ['closed', 'winner_announced'].includes(contender.event_status);
            const activeContenders = allContenders.filter(contender => !isPastEvent(contender));
            const pastContenders = allContenders.filter(isPastEvent);
            const visibleContenders = showingPastContenders ? pastContenders : activeContenders;
            const viewTitle = showingPastContenders ? 'Past Contenders' : 'Current Event Contenders';

            document.querySelector('.contenders-header h1').textContent = viewTitle;
            document.querySelector('.contenders-header > p').textContent = showingPastContenders
                ? 'Explore contenders from completed events and see which event they represented.'
                : 'The current event contenders are shown here. New entrants appear automatically.';
            document.getElementById('currentContendersButton').textContent = `Current Event (${activeContenders.length})`;
            document.getElementById('pastContendersButton').textContent = `Past Contenders (${pastContenders.length})`;
            document.getElementById('currentContendersButton').setAttribute('aria-pressed', String(!showingPastContenders));
            document.getElementById('pastContendersButton').setAttribute('aria-pressed', String(showingPastContenders));

            if (visibleContenders.length === 0) {
                showEmpty(showingPastContenders ? 'No past contenders are available yet.' : 'No contenders have been added to the current event yet.');
                return;
            }

            const contendersByEvent = new Map();
            visibleContenders.forEach(contender => {
                const eventKey = contender.event_id || contender.event_name || 'unknown-event';
                if (!contendersByEvent.has(eventKey)) contendersByEvent.set(eventKey, []);
                contendersByEvent.get(eventKey).push(contender);
            });

            const html = Array.from(contendersByEvent.values()).map(contenders => {
                contenders.sort((first, second) => Number(second.total_votes || 0) - Number(first.total_votes || 0));
                const eventName = contenders[0].event_name || 'Unknown Event';
                const eventStatus = String(contenders[0].event_status || 'unknown').toLowerCase();
                const endedAt = contenders[0].event_ended_at;
                const endedDate = endedAt ? new Date(endedAt) : null;
                return `
                    <section class="contender-event-group">
                        <div class="contender-event-heading">
                            <h2>🏆 ${escapeHtml(eventName)}</h2>
                            <p>${contenders.length} contender${contenders.length === 1 ? '' : 's'}</p>
                            <span class="contender-event-status">${escapeHtml(eventStatus.replace(/_/g, ' '))}</span>
                        </div>
                        <div class="contenders-grid">
                            ${contenders.map((c, index) => {
                                const rank = index + 1;
                                const votes = c.total_votes || 0;
                                const maxVotes = Math.max(...contenders.map(cont => cont.total_votes || 0));
                                const percentage = maxVotes > 0 ? (votes / maxVotes) * 100 : 0;
                                const topClass = rank <= 3 ? `top-${rank}` : '';
                                
                                return `
                                <article class="contender-card ${topClass}" onclick="showDetails('${c.id}')">
                                    <div class="contender-image ${!c.picture ? 'no-image' : ''}">
                                        <div class="rank-badge rank-${rank}">${rank}</div>
                                        <div class="contender-votes-badge">${votes} votes</div>
                                        ${c.picture ? `<img src="${escapeHtml(c.picture)}" alt="${escapeHtml(c.name)}" />` : '🎭'}
                                    </div>
                                    <div class="contender-info">
                                        <h3 class="contender-name">${escapeHtml(c.name)}</h3>
                                        <div class="contender-meta">
                                            ${c.class ? `<span class="meta-tag">📚 ${escapeHtml(c.class)}</span>` : ''}
                                            ${c.country ? `<span class="meta-tag">🌍 ${escapeHtml(c.country)}</span>` : ''}
                                        </div>
                                        ${c.description ? `<p class="contender-description">${escapeHtml(c.description)}</p>` : ''}
                                        <div class="vote-bar">
                                            <div class="vote-fill" style="width: ${percentage}%"></div>
                                        </div>
                                        <button type="button" class="view-btn">View Profile →</button>
                                    </div>
                                </article>
                            `;
                            }).join('')}
                        </div>
                        ${showingPastContenders && endedDate && !Number.isNaN(endedDate.getTime()) ? `<p class="contender-event-detail">Ended ${endedDate.toLocaleDateString()}</p>` : ''}
                    </section>
                `;
            }).join('');
            
            container.innerHTML = html;
        }

        function showContenderView(showPast) {
            showingPastContenders = showPast;
            renderContenders();
        }

        function showDetails(contenderId) {
            const contender = allContenders.find(c => c.id === contenderId);
            if (!contender) return;

            // Set modal content
            const imageDiv = document.getElementById('modalImage');
            if (contender.picture) {
                imageDiv.innerHTML = `<img src="${escapeHtml(contender.picture)}" alt="${escapeHtml(contender.name)}" />`;
                imageDiv.classList.remove('no-image');
            } else {
                imageDiv.innerHTML = '🎭';
                imageDiv.classList.add('no-image');
            }

            document.getElementById('modalName').textContent = contender.name;
            document.getElementById('modalClass').textContent = contender.class || 'N/A';
            document.getElementById('modalCountry').textContent = contender.country || 'N/A';
            document.getElementById('modalDescription').textContent = contender.description || 'No description available';
            document.getElementById('modalEvent').textContent = contender.event_name || 'Unknown event';
            window.selectedContenderId = contenderId;

            // Get and display trophies
            const trophies = getPlayerTrophies(contender.name);
            const trophiesDiv = document.getElementById('modalTrophies');
            const trophyContent = document.getElementById('trophyContent');
            
            if (trophies.length > 0) {
                trophiesDiv.style.display = 'block';
                trophyContent.innerHTML = `
                    <div class="trophy-count">🏆 ${trophies.length} Hall of Fame ${trophies.length === 1 ? 'Entry' : 'Entries'}</div>
                    <div class="trophy-list" style="margin-top: 15px;">
                        ${trophies.map(trophy => `
                            <div class="trophy-item">
                                <span class="trophy-item-icon">🥇</span>
                                <div>
                                    <div class="trophy-item-name">${escapeHtml(trophy.teamName)}</div>
                                    <div class="trophy-item-league">${escapeHtml(trophy.league)} • Season ${trophy.season}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                trophiesDiv.style.display = 'none';
            }

            const canVote = !['closed', 'winner_announced', 'draft'].includes(contender.event_status);
            document.querySelector('.modal-action').hidden = !canVote;

            // Show modal
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function goToVote() {
            const selectedContender = allContenders.find(contender => contender.id === window.selectedContenderId);
            if (!selectedContender || !selectedContender.event_id) return;
            window.location.href = `vote.html?eventId=${encodeURIComponent(selectedContender.event_id)}&contenderId=${encodeURIComponent(selectedContender.id)}`;
        }

        function showEmpty(message) {
            document.getElementById('contendersContainer').innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <h2>😕</h2>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Close modal on overlay click
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });

        // Mobile menu toggle
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const navbarNav = document.getElementById('navbarNav');
        
        if (mobileMenuToggle && navbarNav) {
            mobileMenuToggle.addEventListener('click', function() {
                navbarNav.classList.toggle('active');
                mobileMenuToggle.textContent = navbarNav.classList.contains('active') ? '✕' : '☰';
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!navbarNav.contains(event.target) && !mobileMenuToggle.contains(event.target)) {
                    navbarNav.classList.remove('active');
                    mobileMenuToggle.textContent = '☰';
                }
            });
            
            // Close menu when clicking on a link
            const navLinks = navbarNav.querySelectorAll('a');
            navLinks.forEach(link => {
                link.addEventListener('click', function() {
                    navbarNav.classList.remove('active');
                    mobileMenuToggle.textContent = '☰';
                });
            });
        }

        // Load contenders on page load
        loadContenders();
    </script>
</body>
</html>
