<!doctype html>
<html lang="en" class="tournament-detail-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Management - 🏆 DYNAMIC EFOOTBALL COMMUNITY</title>
  <link rel="stylesheet" href="css/admin-dashboard.css">
  <link rel="stylesheet" href="css/mobile-responsive.css">
  <link rel="stylesheet" href="css/tournament.css">
  <link rel="stylesheet" href="css/admin-tournaments.css">
  <style>
    .tournament-detail-page {
      --tab-bg: #f5f5f5;
      --tab-active-bg: #ffffff;
      --tab-border: #ddd;
      --tab-text: #666;
      --tab-active-text: #000;
    }
    .tournament-detail-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #fafafa;
    }
    .tournament-detail-header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 2rem;
    }
    .tournament-detail-header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    .tournament-detail-header-top h1 {
      margin: 0;
      font-size: 2rem;
    }
    .tournament-detail-header-actions {
      display: flex;
      gap: 0.5rem;
    }
    .tournament-nav-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--tab-border);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .tournament-nav-tabs li {
      margin: 0;
    }
    .tournament-nav-tabs button {
      background: var(--tab-bg);
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--tab-text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      transition: all 200ms ease;
    }
    .tournament-nav-tabs button:hover {
      background: #efefef;
      color: var(--tab-active-text);
    }
    .tournament-nav-tabs button[aria-selected="true"] {
      background: var(--tab-active-bg);
      border-bottom-color: #000;
      color: var(--tab-active-text);
    }
    .tournament-detail-content {
      flex: 1;
      padding: 2rem;
    }
    .tournament-tab-panel {
      display: none;
    }
    .tournament-tab-panel[aria-hidden="false"] {
      display: block;
    }
    .tournament-status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #f0f0f0;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #666;
    }
    .tournament-status-badge.draft { background: #fff3cd; color: #856404; }
    .tournament-status-badge.registration { background: #d1ecf1; color: #0c5460; }
    .tournament-status-badge.draw { background: #d4edda; color: #155724; }
    .tournament-status-badge.in_progress { background: #cfe2ff; color: #084298; }
    .tournament-status-badge.completed { background: #e7d4f5; color: #663399; }
    .tournament-status-badge.cancelled { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body class="tournament-detail-page">
  <div class="tournament-detail-shell">
    <header class="tournament-detail-header">
      <div class="tournament-detail-header-top">
        <div>
          <h1 id="tournament-name">Loading tournament...</h1>
          <span class="tournament-status-badge" id="tournament-status"></span>
        </div>
        <div class="tournament-detail-header-actions">
          <a href="admin-tournaments.html" class="tournament-button ghost">← Back to tournaments</a>
        </div>
      </div>
      <ul class="tournament-nav-tabs">
        <li><button data-tab="home" aria-selected="true">Home</button></li>
        <li><button data-tab="teams">Teams</button></li>
        <li><button data-tab="fixtures">Fixtures</button></li>
        <li><button data-tab="standings">Standings</button></li>
        <li><button data-tab="stats">Stats</button></li>
        <li><button data-tab="results">Results / Manage</button></li>
      </ul>
    </header>

    <main class="tournament-detail-content">
      <div class="tournament-tab-panel" data-panel="home" aria-hidden="false">
        <h2>Home</h2>
        <div id="home-content">Loading tournament home...</div>
      </div>

      <div class="tournament-tab-panel" data-panel="teams" aria-hidden="true">
        <h2>Teams</h2>
        <div id="teams-content">Loading teams...</div>
      </div>

      <div class="tournament-tab-panel" data-panel="fixtures" aria-hidden="true">
        <h2>Fixtures</h2>
        <div id="fixtures-content">Loading fixtures...</div>
      </div>

      <div class="tournament-tab-panel" data-panel="standings" aria-hidden="true">
        <h2>Standings</h2>
        <div id="standings-content">Loading standings...</div>
      </div>

      <div class="tournament-tab-panel" data-panel="stats" aria-hidden="true">
        <h2>Stats</h2>
        <div id="stats-content">Loading stats...</div>
      </div>

      <div class="tournament-tab-panel" data-panel="results" aria-hidden="true">
        <h2>Results / Manage</h2>
        <div id="results-content">Loading results...</div>
      </div>
    </main>
  </div>

  <script src="js/api-config.js"></script>
  <script src="js/tournament-detail.js"></script>
</body>
</html>
